<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Seleccionar región — Clippy</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
    #shot { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; pointer-events: none; }
    #dim { position: fixed; inset: 0; background: rgba(0,0,0,0.35); pointer-events: none; }
    #sel { position: fixed; display: none; outline: 1px solid rgba(255,255,255,0.95); box-shadow: 0 0 0 9999px rgba(0,0,0,0.35); pointer-events: none; }
    #size { position: fixed; display: none; padding: 2px 6px; border-radius: 4px; font: 600 11px "Segoe UI", system-ui, sans-serif; background: rgba(0,0,0,0.75); color: #fff; pointer-events: none; }
    #tip { position: fixed; left: 50%; top: 24px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; font: 600 13px "Segoe UI", system-ui, sans-serif; background: rgba(0,0,0,0.72); color: #fff; pointer-events: none; }
  </style>
</head>
<body>
  <img id="shot" alt="">
  <div id="dim"></div>
  <div id="sel"></div>
  <div id="size"></div>
  <div id="tip">Arrastra para seleccionar · Esc para cancelar</div>
  <script src="overlay.js"></script>
</body>
</html>
