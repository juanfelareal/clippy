<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Calculadora — Clippy</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { padding: 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); }
    .row { display: flex; align-items: center; gap: 8px; }
    .row svg { flex: none; color: var(--fg-2); }
    #in { flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; }
    #in::placeholder { color: var(--fg-3); }
    .res { display: flex; align-items: baseline; justify-content: space-between; }
    #out { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; user-select: text; font-variant-numeric: tabular-nums; }
    #out.none { color: var(--fg-3); opacity: 0.6; }
    #hint { font-size: 10px; color: var(--fg-2); visibility: hidden; }
  </style>
</head>
<body>
  <div class="row">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 9h4M10 7v4M8 15.5h4M14 14l3 3M17 14l-3 3"/></svg>
    <input id="in" type="text" placeholder="1.500.000 + IVA, 20% de 300.000..." autocomplete="off" spellcheck="false">
  </div>
  <div class="res"><span id="out" class="none">—</span><span id="hint">Enter copiar</span></div>
  <script src="../shared/calculator.js"></script>
  <script src="calculator.js"></script>
</body>
</html>
