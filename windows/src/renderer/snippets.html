<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Snippets — Clippy</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { display: flex; user-select: none; }
    .side { width: 240px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--bg-elev); }
    #list { flex: 1; overflow-y: auto; padding: 6px; }
    .item { padding: 7px 10px; border-radius: 6px; cursor: default; }
    .item:hover { background: var(--chip); }
    .item.sel { background: var(--accent); color: var(--accent-fg); }
    .item .t { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-weight: 600; font-size: 13px; }
    .item .e { font-size: 11px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .item.sel .e { color: rgba(255,255,255,0.8); }
    .side .bar { display: flex; align-items: center; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
    .side .bar .btn { padding: 2px 10px; font-size: 15px; line-height: 20px; }
    .side .bar .n { margin-left: auto; font-size: 11px; color: var(--fg-2); }
    .empty { padding: 18px 12px; color: var(--fg-2); font-size: 12px; line-height: 1.5; }
    .editor { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    h2 { margin: 0; font-size: 15px; font-weight: 600; }
    label { font-size: 12px; color: var(--fg-2); display: block; margin-bottom: 4px; }
    .trig { display: flex; align-items: center; gap: 2px; }
    .trig span { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; color: var(--fg-2); }
    input, textarea { width: 100%; border: 1px solid var(--line); background: var(--field); border-radius: 6px; padding: 6px 8px; outline: none; user-select: text; }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    #trigger { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; }
    textarea { flex: 1; min-height: 120px; resize: none; line-height: 1.45; }
    .small { font-size: 11px; color: var(--fg-3); margin-top: 4px; }
    .grow { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #error { display: none; font-size: 12px; color: var(--warn); }
    #warn { display: none; font-size: 12px; color: var(--warn); }
    .buttons { display: flex; gap: 8px; }
    .buttons .spacer { flex: 1; }
  </style>
</head>
<body>
  <div class="side">
    <div id="list"></div>
    <div class="bar">
      <button class="btn" id="add" title="Nuevo snippet">+</button>
      <button class="btn" id="del" title="Eliminar snippet" disabled>−</button>
      <span class="n" id="n">0 snippets</span>
    </div>
  </div>
  <div class="editor">
    <h2 id="title">Nuevo snippet</h2>
    <div>
      <label for="trigger">Atajo (se escribe como //atajo)</label>
      <div class="trig"><span>//</span><input id="trigger" type="text" placeholder="nit" maxlength="32" spellcheck="false" autocomplete="off"></div>
      <div class="small">Solo minúsculas y números, sin espacios (máx. 32).</div>
    </div>
    <div class="grow">
      <label for="expansion">Texto a insertar</label>
      <textarea id="expansion" spellcheck="false"></textarea>
    </div>
    <div id="error"></div>
    <div id="warn">⚠ La escucha global del teclado no está activa: los snippets no se expandirán hasta reiniciar Clippy.</div>
    <div class="buttons">
      <button class="btn" id="cancel" style="display:none">Cancelar</button>
      <span class="spacer"></span>
      <button class="btn primary" id="save" disabled>Agregar</button>
    </div>
  </div>
  <script src="snippets.js"></script>
</body>
</html>
